# Held-out evaluation prompts for STEVIE.
#
# These prompts are NEVER used for training. `glimmer data build stevie-sft` checks every
# training conversation against them (MinHash similarity) and excludes overlaps. The first four
# are the example interactions from the project brief, deliberately kept out of the training
# corpus so STEVIE's answers to them are generated, not memorised.
#
# Multi-turn prompts include a fixed earlier assistant turn; `expect_any` lists words a reply
# that uses the earlier context would plausibly contain (a crude continuity probe).

[[prompt]]
id = "brief-greeting"
category = "greeting"
messages = [{ role = "user", content = "How are you going, mate?" }]

[[prompt]]
id = "brief-rust"
category = "tech"
messages = [{ role = "user", content = "What should I learn first in Rust?" }]

