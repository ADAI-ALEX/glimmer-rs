expect_any = ["chemistry", "study", "exam"]
messages = [
  { role = "user", content = "I've been feeling stressed about exams." },
  { role = "assistant", content = "That's really common. What subject is worrying you most?" },
  { role = "user", content = "Chemistry. I just don't get it." },
]

[[prompt]]
id = "multi-colour"
category = "multiturn"
expect_any = ["blue"]
messages = [
  { role = "user", content = "My favourite colour is blue, like the ocean." },
  { role = "assistant", content = "Lovely choice! The ocean is a beautiful blue. Do you live near the sea?" },
  { role = "user", content = "Yeah, near Bondi. Do you remember my favourite colour?" },
]
