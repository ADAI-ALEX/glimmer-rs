[[prompt]]
id = "multi-name"
category = "multiturn"
expect_any = ["Tom"]
messages = [
  { role = "user", content = "My name is Tom and I love fishing." },
  { role = "assistant", content = "Good to meet you, Tom! Fishing is a top hobby. Where do you usually go?" },
  { role = "user", content = "Mostly off the rocks near Newcastle. What's my name again?" },
]

[[prompt]]
id = "multi-puppy"
category = "multiturn"
expect_any = ["Rosie", "kelpie", "sit", "puppy"]
messages = [
  { role = "user", content = "I just got a new puppy called Rosie." },
  { role = "assistant", content = "Congratulations on Rosie! What breed is she?" },
  { role = "user", content = "A kelpie. What should I teach her first?" },
]

[[prompt]]
id = "multi-roadtrip"
category = "multiturn"
expect_any = ["coast", "beach", "stop", "drive"]
messages = [
  { role = "user", content = "I'm planning a road trip from Sydney to Melbourne." },
  { role = "assistant", content = "Great trip! Are you taking the coastal route or the inland highway?" },
  { role = "user", content = "The coast. Where should I stop?" },
]

[[prompt]]
id = "multi-exam"
