# STEVIE stage 2: supervised conversational fine-tuning on the original Australian corpus.
#
# Starts from the best pretraining checkpoint (`run:stevie-pretrain`). Loss is computed only on
# STEVIE's turns and their closing <|end|>. The dataset is small (~46k tokens, ~11 steps per
# epoch at batch 8) and a 14M model memorises it within a few epochs, so training is short
# (54 steps, ~4.8 epochs), validated every ~quarter epoch, and stopped early on validation loss;
# the best checkpoint is exported as `models/stevie`. Learning rate, weight decay and dropout
# come from the hyperparameter study in configs/tuning/stevie-sft-search.toml (see
# docs/training.md and docs/optimisation.md).
[run]
name = "stevie-sft"
stage = "sft"
seed = 7
backend = "auto"
export_as = "stevie"

[model]
# From stevie-sft-search (trial 10 of 24, best validation loss 3.892).
dropout = 0.02

[data]
dataset = "stevie-sft"

[init]
from_checkpoint = "run:stevie-pretrain"

[optimizer]
kind = "adamw"
lr = 3.08e-4
min_lr = 3.08e-5
weight_decay = 0.106
beta1 = 0.9
beta2 = 0.95
grad_clip = 1.0

[schedule]
kind = "cosine"
warmup_steps = 5
max_steps = 54

[batch]
batch_size = 8
grad_accum = 1

[eval]
every = 3
batches = 8
sample_prompts = true

[checkpoint]
every = 0
keep_last = 1

[early_stopping]
patience = 6
min_delta = 0.002
